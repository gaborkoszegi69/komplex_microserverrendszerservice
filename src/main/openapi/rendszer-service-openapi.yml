openapi: 3.1.0
info:
  title: Rendszer-service
  description: Rendszer-service
  version: 1.0.0
servers:
  - url: 'https://localhost:8187'
paths:
   '/DMMenuapi':
    post:
      tags:
        - MenuController
      operationId: getMenuByUserId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TMenu2Dto'

      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              $ref: '#/components/schemas/TSearchUserDto'
   '/DMmenuparameterekapi':
     post:
       tags:
         - MenuParameterekController
       operationId: getParameterekByUserId
       responses:
         '200':
           description: OK
           content:
             application/json:
               schema:
                 type: array
                 items:
                   $ref: '#/components/schemas/TMenuparameterekDto'

       requestBody:
         content:
           multipart/form-data:
             schema:
               type: object
               $ref: '#/components/schemas/TSearchMenuparameterekDto'


components:
  schemas:
    TMenu2Dto:
      type: object
      properties:
        menu_id:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menu_gyoker:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menu_gyokersorrend:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menu_title:
          type: string
          x-java-type: java.lang.String
        menu_link:
          type: string
          x-java-type: java.lang.String
        menu_parentid:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menu_letre_felh_nev:
          type: string
          x-java-type: java.lang.String
        menu_letre_dat:
          type: string
          x-java-type: java.lang.String
        menu_action:
          type: string
          x-java-type: java.lang.String
        menu_sorrend:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menu_image_index:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menu_shortcut:
          type: string
          x-java-type: java.lang.String
        menu_hlevel:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        szrpfnk_uj_eng:
          type: boolean
        szrpfnk_modositas_eng:
          type: boolean
        szrpfnk_visible_engs:
          type: boolean
    TSearchUserDto:
      type: object
      properties:
        userid:
          type: string
          x-java-type: java.lang.String
    TSearchMenuparameterekDto:
      type: object
      properties:
        menu_id:
          type: integer
          format: int64
          x-java-type: java.lang.Long
    TMenuparameterekDto:
      type: object
      properties:
        menuprm_id:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menuprm_menu_id:
          type: integer
          format: int64
          x-java-type: java.lang.Long
        menuprm_name:
          type: string
          x-java-type: java.lang.String
        menuprm_value:
          type: string
          x-java-type: java.lang.String
        menuprm_letre_felh_nev:
          type: string
          x-java-type: java.lang.String
        menuprm_letre_dat:
          type: string
          x-java-type: java.lang.String
